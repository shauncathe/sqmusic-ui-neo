  /* ============================================================= SETTINGS */
  const dirty = new Map();

  function parseOptions(raw) {
    if (!raw) return [];
    try {
      const p = JSON.parse(raw);
      if (Array.isArray(p)) return p.map(o => typeof o === 'object' ? o : { label: o, value: o });
    } catch (e) { /* not JSON — plain remark text, ignore */ }
    return [];
  }

  const GROUP_ORDER = ['system', 'plug', 'expand'];
  function groupOf(key) {
    if (key.startsWith('system.')) return { g: 'system', name: '系统设置', sub: '' };
    if (key.startsWith('plug.')) { const p = key.split('.')[1]; return { g: 'plug', name: `插件 · ${plugLabel(p)}`, sub: p }; }
    if (key.startsWith('expand.aliyun.')) return { g: 'expand', name: '阿里云盘', sub: 'aliyun' };
    return { g: 'expand', name: '其他设置', sub: '' };
  }

  views.settings = function () {
    dirty.clear();
    $('#content').innerHTML = `
      <div class="page-head">
        <div><h1>设置</h1><p class="subtitle">完整保留原版配置，仅提交被修改过的字段。</p></div>
        <div class="head-actions">
          <button class="btn" id="setReload">↻ 重新读取</button>
          <button class="btn" id="setImport">导入歌单数据</button>
          <button class="btn primary" id="setSave">保存修改 <span id="dirtyBadge" class="tag" hidden>0</span></button>
        </div>
      </div>
      <section class="panel">
        <div class="panel-head"><div><strong>插件登录与操作</strong><small>　二维码扫码、签到、刷新凭据</small></div></div>
        <div class="panel-body grid-even" id="plugActions"></div>
      </section>
      <div id="settingGroups"></div>
      <section class="panel">
        <div class="panel-head"><strong>辅助功能</strong></div>
        <div class="panel-body" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="setTheme">切换主题</button>
          <button class="btn" id="setPwa">安装应用到桌面</button>
          <button class="btn danger" id="setLogout">退出登录</button>
        </div>
      </section>
      <input type="file" id="importFile" accept=".json" hidden>`;

    $('#setReload').onclick = async () => { await reloadConfigs(); views.settings(); ok('已重新读取设置'); };
    $('#setSave').onclick = saveDirtyConfigs;
    $('#setTheme').onclick = toggleTheme;
    $('#setPwa').onclick = installPwa;
    $('#setLogout').onclick = doLogout;
    $('#setImport').onclick = () => $('#importFile').click();
    $('#importFile').onchange = async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try { await api.importSongList(fd); ok('配置导入成功!'); }
      catch (er) { err(`配置导入失败：${er.message}`); }
      finally { e.target.value = ''; }
    };

    renderPlugActions();
    renderSettingGroups();
  };

  function renderSettingGroups() {
    const visible = app.configs.filter(c => c.configShow !== 0 && c.configShow !== '0');
    const buckets = new Map();
    visible.forEach(c => {
      const { g, name } = groupOf(c.configKey);
      const k = `${GROUP_ORDER.indexOf(g)}|${name}`;
      if (!buckets.has(k)) buckets.set(k, []);
      buckets.get(k).push(c);
    });
    const sorted = [...buckets.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh'));
    $('#settingGroups').innerHTML = sorted.map(([k, items]) => {
      const name = k.split('|')[1];
      return `<section class="panel"><div class="panel-head"><div><strong>${esc(name)}</strong><small>　${items.length} 项</small></div></div>
        ${items.map(c => settingRow(c)).join('')}</section>`;
    }).join('');
    bindSettingControls();
  }

  function settingRow(c) {
    const disabled = c.configDisabled === 1 || c.configDisabled === '1';
    const key = esc(c.configKey);
    let control;
    if (c.configType === 'boolean') {
      control = `<button class="switch ${c.configValue === 'true' ? 'on' : ''}" data-k="${key}" data-t="boolean" ${disabled ? 'disabled' : ''} aria-label="切换"></button>`;
    } else if (c.configType === 'select') {
      const opts = parseOptions(c.configOptions);
      control = `<select data-k="${key}" data-t="select" ${disabled ? 'disabled' : ''}>
        ${opts.length ? '' : '<option value="">该配置项没有有效的选项列表</option>'}
        ${opts.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(c.configValue) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    } else {
      const type = c.configType === 'password' ? 'password' : c.configType === 'number' ? 'number' : 'text';
      control = `<input type="${type}" ${c.configType === 'number' ? 'min="0"' : ''} data-k="${key}" data-t="${esc(c.configType)}" value="${esc(c.configValue ?? '')}" ${disabled ? 'disabled' : ''}>`;
    }
    return `<div class="setting-row" data-row="${key}">
      <div class="setting-copy"><strong>${esc(c.configName || c.configKey)}</strong>
        <small>${esc((c.configRemark || c.configKey).replace(/\/n/g, '\n'))}</small>
        <small style="opacity:.6">${key}</small></div>
      <div class="setting-control">${c.configType === 'boolean' ? '' : control}</div>
      ${c.configType === 'boolean' ? control : ''}
    </div>`;
  }

  function bindSettingControls() {
    $$('#settingGroups [data-k]').forEach(el => {
      const key = el.dataset.k;
      const cfg = app.configMap[key];
      const mark = value => {
        const original = cfg?.configValue ?? '';
        if (String(value) === String(original ?? '')) dirty.delete(key); else dirty.set(key, String(value));
        el.closest('.setting-row').classList.toggle('dirty', dirty.has(key));
        validateRow(el, cfg);
        updateDirtyBadge();
      };
      if (el.dataset.t === 'boolean') {
        el.onclick = () => { el.classList.toggle('on'); mark(el.classList.contains('on')); };
      } else {
        el.oninput = () => mark(el.value);
        el.onchange = () => mark(el.value);
      }
    });
    updateDirtyBadge();
  }

  function validateRow(el, cfg) {
    const row = el.closest('.setting-row');
    let msg = '';
    const v = el.dataset.t === 'boolean' ? String(el.classList.contains('on')) : el.value;
    if (cfg?.configNullCheck === 1 && dirty.has(cfg.configKey) && String(v).trim() === '') msg = '请填写内容';
    if (cfg?.configType === 'number' && v !== '' && (!Number.isFinite(+v) || +v < 0)) msg = '数值类型必须大于等于 0';
    row.classList.toggle('invalid', !!msg);
    let hint = row.querySelector('.err-hint');
    if (msg) {
      if (!hint) { hint = document.createElement('small'); hint.className = 'err-hint'; hint.style.color = 'var(--red)'; row.querySelector('.setting-copy').append(hint); }
      hint.textContent = msg;
    } else if (hint) hint.remove();
    return !msg;
  }

  function updateDirtyBadge() {
    const badge = $('#dirtyBadge');
    if (!badge) return;
    badge.hidden = dirty.size === 0;
    badge.textContent = String(dirty.size);
  }

  async function saveDirtyConfigs() {
    if (!dirty.size) { toast('没有需要保存的修改'); return; }
    let bad = false;
    $$('#settingGroups [data-k]').forEach(el => { if (dirty.has(el.dataset.k) && !validateRow(el, app.configMap[el.dataset.k])) bad = true; });
    if (bad) { err('存在校验不通过的配置项'); return; }
    const btn = $('#setSave'); btn.disabled = true;
    const entries = [...dirty.entries()];
    let failed = [];
    for (const [k, v] of entries) {
      try { await api.updateConfig(k, v); } catch (e) { failed.push(`${k}: ${e.message}`); }
    }
    btn.disabled = false;
    await reloadConfigs();
    if (failed.length) { err(`修改失败：${failed[0]}`); }
    else ok(`修改成功! 共 ${entries.length} 项`);
    views.settings();
  }

  function renderPlugActions() {
    const box = $('#plugActions');
    const kgOn = app.configMap['plug.kg.open']?.configValue === 'true';
    const qqOn = app.configMap['plug.qqvip.open']?.configValue === 'true';
    box.innerHTML = `
      <div class="step">
        <div class="step-head"><strong>酷狗（kg）</strong><span class="state ${kgOn ? 'ok' : 'bad'}">${kgOn ? '插件已开启' : '插件未开启'}</span></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn sm" data-act="kgQr">① 获取微信二维码</button>
          <button class="btn sm" data-act="kgStatus">② 检查扫码状态</button>
          <button class="btn sm" data-act="kgSign">酷狗手动签到</button>
          <button class="btn sm" data-act="kgToken">刷新登录信息</button>
        </div>
        <div style="color:var(--muted);font-size:11px;margin-top:8px">签到时间：${esc(app.configMap['plug.kg.sign.begin-end.time']?.configValue || '暂无签到信息请手动签到')}</div>
      </div>
      <div class="step">
        <div class="step-head"><strong>QQ 音乐（qqvip）</strong><span class="state ${qqOn ? 'ok' : 'bad'}">${qqOn ? '插件已开启' : '插件未开启'}</span></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn sm" data-act="qqQr">① 手机 QQ 二维码</button>
          <button class="btn sm" data-act="qqWx">① 微信二维码</button>
          <button class="btn sm" data-act="qqStatus">② 检查扫码状态</button>
          <button class="btn sm" data-act="qqCookie">刷新当前登录 cookie</button>
        </div>
        <div style="color:var(--muted);font-size:11px;margin-top:8px">注意区分手机QQ登录二维码和微信登录二维码。</div>
      </div>`;
    const showQr = async (title, fn, statusFn) => {
      const m = modal({ title, body: '<div class="empty">获取中…</div>', actions: [{ label: '关闭' }, { label: '检查扫码状态', kind: 'primary', onClick: () => checkQr(statusFn) }] });
      try {
        const img = await fn();
        const src = typeof img === 'string' ? img : (img?.qrCode || img?.image || '');
        m.setBody(src ? `<img class="qr" src="${esc(src)}" alt="二维码"><p style="text-align:center;color:var(--muted);margin:10px 0 0">扫码后点「检查扫码状态」</p>` : '<div class="empty">未返回二维码</div>');
      } catch (e) { m.setBody(`<div class="empty">获取失败：${esc(e.message)}</div>`); }
    };
    const checkQr = async fn => {
      try {
        const r = await fn();
        const text = typeof r === 'string' ? r : JSON.stringify(r);
        ok(`获取的状态是：${text}`);
        await reloadConfigs();
      } catch (e) { err(`扫码有点问题，重试一下或者检查下网络：${e.message}`); }
    };
    const acts = {
      kgQr: () => showQr('酷狗微信二维码', api.kgWxQr, api.kgWxQrStatus),
      kgStatus: () => checkQr(api.kgWxQrStatus),
      kgSign: async () => { try { const r = await api.kgSignIn(); ok(`签到成功：${typeof r === 'string' ? r : JSON.stringify(r ?? '')}`); } catch (e) { err(`签到失败：${e.message}`); } },
      kgToken: async () => { try { await api.kgRefreshToken(); ok('刷新成功'); } catch (e) { err(`刷新失败：${e.message}`); } },
      qqQr: () => showQr('手机 QQ 登录二维码', api.qqQr, api.qqQrStatus),
      qqWx: () => showQr('微信登录二维码', api.qqWechatQr, api.qqQrStatus),
      qqStatus: () => checkQr(api.qqQrStatus),
      qqCookie: async () => { try { await api.qqRefreshCookie(); ok('刷新成功'); } catch (e) { err(`刷新失败：${e.message}`); } }
    };
    $$('[data-act]', box).forEach(b => b.onclick = () => acts[b.dataset.act]());
  }

  /* ================================================================ chrome */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    $('#themeBtn').textContent = theme === 'dark' ? '☀' : '☾';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b1420' : '#173f73');
  }
  function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  }
  $('#themeBtn').onclick = toggleTheme;

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
  async function installPwa() {
    if (!deferredPrompt) { toast('当前环境暂不支持安装或已安装'); return; }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    toast(outcome === 'accepted' ? '用户接受了PWA安装' : '用户拒绝了PWA安装');
  }

  async function doLogout() {
    if (!await confirmBox('退出登录', '确定要退出当前账号吗？', { danger: true, confirmLabel: '退出' })) return;
    try { await api.logout(); } catch (e) { /* token may already be gone */ }
    store.token = '';
    ok('退出成功');
    onAuthLost();
  }
  $('#logoutBtn').onclick = doLogout;

  /* --------------------------------------------------------------- boot */
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = new FormData(e.currentTarget);
    const btn = e.currentTarget.querySelector('button');
    btn.disabled = true;
    $('#loginError').textContent = '';
    try {
      const base = (form.get('apiBase') || '').trim();
      API = base ? base.replace(/\/+$/, '') : '/api';
      const r = await api.login(form.get('username'), form.get('password'));
      if (!r?.tokenValue) throw new Error('登录返回中没有 token');
      setApiBase(base);
      store.token = r.tokenValue;
      $('#loginView').hidden = true;
      await boot();
    } catch (er) {
      $('#loginError').textContent = er.message;
    } finally { btn.disabled = false; }
  });

  async function reloadConfigs() {
    const list = await api.getConfigList();
    app.configs = Array.isArray(list) ? list : Object.values(list || {});
    app.configMap = Object.fromEntries(app.configs.map(c => [c.configKey, c]));
  }

  async function loadNetworkRate() {
    if (!app.trafficOn) { $('#rateBox').hidden = true; return; }
    try {
      const r = await api.getCurrentNetwork();
      $('#rateBox').hidden = false;
      $('#downRate').textContent = r?.downloadSpeedFormatted || r?.downloadSpeed || '--';
      $('#upRate').textContent = r?.uploadSpeedFormatted || r?.uploadSpeed || '--';
    } catch (e) { $('#downRate').textContent = '--'; $('#upRate').textContent = '--'; }
  }

  let rateTimer = null;
  async function boot() {
    try {
      await reloadConfigs();
    } catch (e) {
      onAuthLost();
      return;
    }
    app.trafficOn = app.configMap['system.show.traffic.monitoring']?.configValue === 'true';
    try { app.plugins = await api.getOption() || []; } catch (e) { app.plugins = []; }
    try { app.version = await api.version(); $('#brandVersion').textContent = `v${app.version} · web`; } catch (e) { /* ignore */ }
    const account = app.configMap['system.login.account']?.configValue || 'SQ';
    $('#avatar').textContent = account.slice(0, 2).toUpperCase();
    renderNav();
    const hash = location.hash.replace('#', '');
    go(PAGES.some(p => p.key === hash) ? hash : 'home');
    if (rateTimer) clearInterval(rateTimer);
    loadNetworkRate();
    if (app.trafficOn) rateTimer = setInterval(loadNetworkRate, 4000);
  }

  applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  // prefill saved backend API base on the login screen (empty when default /api)
  { const ib = $('#apiBaseInput'); if (ib) ib.value = getApiBase() === '/api' ? '' : getApiBase(); }

  /* PWA manifest is injected at runtime so the app stays a single file. */
  (function injectManifest() {
    const manifest = {
      name: 'SQMusic', short_name: 'SQMusic', start_url: './', display: 'standalone',
      background_color: '#f5f8fc', theme_color: '#173f73', scope: './',
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%232f6fed'/%3E%3Ctext x='256' y='330' text-anchor='middle' font-family='Arial' font-size='200' font-weight='700' fill='%23ffffff'%3ESQ%3C/text%3E%3C/svg%3E",
        sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
      }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.append(link);
  })();
  if ('serviceWorker' in navigator) {
    // sw.js is optional; registration failure must never break the app.
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (h && h !== app.page && PAGES.some(p => p.key === h)) go(h);
  });

  if (store.token) boot(); else $('#loginView').hidden = false;
  </script>
</body>
</html>
